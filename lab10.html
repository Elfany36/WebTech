<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lab 10</h1>
    <form action="#" method="post">

        <label for="name">Name</label>
        <input type="text" id="name" name="Enter your name:">

        <label for="email">Email</label>
        <input type="text" id="email" name="Enter your email:">

        <label for="password">Password</label>
        <input type="password" id="password" name="Enter your password:">

        <br><br>

        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">

        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female">

        <br><br>

        <br><br>

        <label for="html">HTML</label>
        <input type="checkbox" name="interest" id="html" value="male">

        <label for="css">CSS</label>
        <input type="checkbox" name="interest" id="css" value="css">

        <br><br>

        <lable for="course">Course</lable>
        <select id="course" name="course">
            <option value="web">Web</option>
            <option value="cs">CS</option>
            <option value="network">Network</option>
        </select>

        <br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">

    </form>
</body>
</html>
